title: Room

buttons:
  - languages

options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  changeTitle: false
  create: true
  delete: false
  duplicate: false
  move: false
  preview: false
  sort: false
  update: true

columns:
  - width: 1/3
    fields:
      background_color:
        label: Background color
        type: color
        translate: false
      image_color:
        label: Image color
        type: color
        translate: false
      font_color:
        label: Font color
        type: color
        translate: false
  - width: 2/3
    sections:
      artworks:
        type: pages
        label: Artworks
        batch: true
        create: artwork
        search: false
        status: listed
        template: artwork
        text: "{{ page.artwork_title.or(page.title) }}"
        info: "#{{ page.num }} — {{ page.artist_name }}"
        sortable: true
