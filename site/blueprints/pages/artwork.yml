title: Artwork

buttons:
  - languages

num: default

options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  changeTitle: false
  delete: true
  duplicate: false
  move: false
  preview: false
  sort: true
  update: true

status:
  draft: false
  unlisted: false
  listed:
    label: Published

# Create artworks from the two content fields only. Kirby derives the page title
# and slug from the artwork title and immediately lists the new page.
create:
  title: "{{ page.artwork_title }}"
  slug: "{{ page.artwork_title.slug }}"
  status: listed
  fields:
    - artist_name
    - artwork_title

fields:
  artist_name:
    label: Artist name
    type: text
    required: true

  artwork_title:
    label: Artwork title
    type: text
    required: true

  audio:
    label: Audio
    type: files
    max: 1
    layout: list
    query: page.files
    uploads:
      template: audio
