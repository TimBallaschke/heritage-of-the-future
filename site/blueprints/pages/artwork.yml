title: Artwork

# Auto-generate the slug from the title so the user doesn't have to enter a
# "URL appendix" when creating an artwork. Setting create.slug to a string
# hides the slug field from the create dialog (Kirby derives it from the title).
create:
  slug: "{{ page.title.slug }}"

fields:
  artist_name:
    label: Artist name
    type: text

  artwork_title:
    label: Artwork title
    type: text

  audio:
    label: Audio
    type: files
    max: 1
    layout: list
    query: page.files
    uploads:
      template: audio
