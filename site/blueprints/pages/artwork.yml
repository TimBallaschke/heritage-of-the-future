title: Artwork

buttons:
  - languages

num: default

options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  changeTitle: true
  delete: true
  duplicate: false
  move: false
  preview: false
  sort: true
  update: true

status:
  draft: false
  unlisted: false
  listed:
    label: Published

# Create artworks from the two content fields and a manually entered URL.
# Kirby derives the page title from the artwork title and immediately lists the new page.
create:
  title: "{{ page.artwork_title }}"
  status: listed
  fields:
    - artist_name
    - artwork_title

fields:
  artist_name:
    label: Artist name
    type: text
    help: Use `<br>` to add a line break.
    required: true

  artwork_title:
    label: Artwork title
    type: text
    help: Use `<br>` to add a line break.
    required: true

  page_url:
    label: URL
    type: info
    text: "{{ page.url }}"

  audio:
    label: Audio
    type: files
    max: 1
    layout: list
    query: page.files
    uploads:
      template: audio
